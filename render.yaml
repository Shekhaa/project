services:
  - type: web
    name: campus-connect-api
    runtime: python
    region: singapore # Closest region to India for lowest latency
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: campus-connect-db
          property: connectionString
      - key: BACKEND_URL
        value: "https://campus-connect-api-us3i.onrender.com"
      - key: CLOUDINARY_CLOUD_NAME
        value: "cvwywt63"
      - key: CLOUDINARY_API_KEY
        value: "167684133529433"
      - key: CLOUDINARY_API_SECRET
        value: "uPjSxrttG6NvH8xbU5vedPMYPB0"
      - key: CLOUDINARY_MEDIA_FOLDER
        value: "campus_connect"

databases:
  - name: campus-connect-db
    plan: free
    region: singapore
