<!-- Post Card Component -->
<article class="p-4 sm:p-5 hover:bg-slate-900/30 transition duration-150 border-b border-slate-800/80">
    <div class="flex items-start gap-3">
        <!-- Author Avatar -->
        <a href="{% url 'accounts:profile' post.author.username %}" class="shrink-0">
            <img src="{{ post.author.profile.avatar_url }}" alt="{{ post.author.username }}"
                class="w-10 h-10 rounded-full object-cover border border-slate-700 hover:opacity-90 transition">
        </a>

        <!-- Content Area -->
        <div class="flex-1 min-w-0">
            <!-- Header (Author info + Date + Menu) -->
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2 truncate">
                    <a href="{% url 'accounts:profile' post.author.username %}" class="font-bold text-sm text-slate-100 hover:underline truncate">
                        {{ post.author.get_full_name|default:post.author.username }}
                    </a>
                    <span class="text-xs text-slate-400 truncate">@{{ post.author.username }}</span>
                    <span class="text-xs text-slate-500">·</span>
                    <time class="text-xs text-slate-500" title="{{ post.created_at }}">{{ post.created_at|timesince }} ago</time>
                </div>

                {% if post.author == user %}
                <div class="relative group">
                    <button class="text-slate-500 hover:text-slate-300 p-1.5 rounded-full hover:bg-slate-800 transition">
                        <i class="fa-solid fa-ellipsis"></i>
                    </button>
                    <div class="hidden group-hover:block absolute right-0 top-6 w-36 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl py-1 z-20">
                        <form action="{% url 'posts:post_delete' post.id %}" method="POST" onsubmit="return confirm('Delete this post?');">
                            {% csrf_token %}
                            <button type="submit" class="w-full text-left px-4 py-2 text-xs text-rose-400 hover:bg-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-trash-can"></i> Delete Post
                            </button>
                        </form>
                    </div>
                </div>
                {% endif %}
            </div>

            <!-- Post Text -->
            <div class="mt-2 text-sm text-slate-200 leading-relaxed whitespace-pre-line">
                {{ post.content }}
            </div>

            <!-- Attached Image (if present) -->
            {% if post.image %}
            <div class="mt-3 rounded-2xl overflow-hidden border border-slate-800 max-h-96 bg-black flex items-center justify-center">
                <a href="{% url 'posts:post_detail' post.id %}" class="w-full">
                    <img src="{{ post.image.url }}" alt="Post image" class="w-full max-h-96 object-cover hover:opacity-95 transition">
                </a>
            </div>
            {% endif %}

            <!-- Interactive Action Footer -->
            <div class="flex items-center justify-between mt-4 max-w-md text-slate-400 text-xs">
                <!-- Like Button -->
                <a href="{% url 'posts:post_like' post.id %}"
                   class="flex items-center gap-1.5 transition group
                   {% if user in post.likes.all %}text-rose-500 font-semibold{% else %}hover:text-rose-400{% endif %}">
                    <div class="p-2 rounded-full group-hover:bg-rose-500/10 transition">
                        <i class="{% if user in post.likes.all %}fa-solid fa-heart{% else %}fa-regular fa-heart{% endif %} text-base"></i>
                    </div>
                    <span>{{ post.total_likes }}</span>
                </a>

                <!-- Comment Button -->
                <a href="{% url 'posts:post_detail' post.id %}"
                   class="flex items-center gap-1.5 hover:text-indigo-400 transition group">
                    <div class="p-2 rounded-full group-hover:bg-indigo-500/10 transition">
                        <i class="fa-regular fa-comment text-base"></i>
                    </div>
                    <span>{{ post.comments_count }}</span>
                </a>

                <!-- Bookmark Button -->
                <a href="{% url 'posts:post_bookmark' post.id %}"
                   class="flex items-center gap-1.5 transition group
                   {% if post.id in user_bookmarked_ids %}text-amber-400{% else %}hover:text-amber-400{% endif %}">
                    <div class="p-2 rounded-full group-hover:bg-amber-400/10 transition">
                        <i class="{% if post.id in user_bookmarked_ids %}fa-solid fa-bookmark{% else %}fa-regular fa-bookmark{% endif %} text-base"></i>
                    </div>
                </a>

                <!-- Share Link Copy Button -->
                <button onclick="navigator.clipboard.writeText(window.location.origin + '{% url 'posts:post_detail' post.id %}'); alert('Post link copied to clipboard!');"
                    class="p-2 rounded-full hover:bg-slate-800 hover:text-slate-200 transition">
                    <i class="fa-solid fa-arrow-up-from-bracket text-base"></i>
                </button>
            </div>
        </div>
    </div>
</article>
