{% extends 'base.html' %}

{% block title %}Sign In - SocialPulse{% endblock %}

{% block auth_content %}
<div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur-xl">
    <div class="text-center mb-8">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white text-2xl shadow-xl shadow-indigo-500/30 mb-4">
            <i class="fa-solid fa-shapes"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Welcome back</h1>
        <p class="text-sm text-slate-400 mt-1">Sign in to check what your network is sharing</p>
    </div>

    <form method="POST" action="{% url 'accounts:login' %}" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Username</label>
            <div class="relative">
                <i class="fa-solid fa-user absolute left-4 top-3.5 text-slate-500 text-sm"></i>
                <input type="text" name="username" required autofocus placeholder="Enter your username"
                    class="w-full pl-11 pr-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-indigo-500 transition">
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
            <div class="relative">
                <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-500 text-sm"></i>
                <input type="password" name="password" required placeholder="Enter your password"
                    class="w-full pl-11 pr-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-indigo-500 transition">
            </div>
        </div>

        <button type="submit"
            class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200 mt-2">
            Sign In
        </button>
    </form>

    <div class="text-center mt-6 pt-6 border-t border-slate-800 text-sm text-slate-400">
        Don't have an account? 
        <a href="{% url 'accounts:register' %}" class="text-indigo-400 hover:text-indigo-300 font-semibold ml-1">Sign up</a>
    </div>
</div>
{% endblock %}
